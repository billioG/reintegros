<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BillScanner 2026 - Control de Facturas</title>
    <meta name="description" content="Gestión inteligente de facturas con OCR y sincronización offline.">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="index.css">
    
    <!-- Supabase & Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="logo">
                <i data-lucide="scan-line" class="icon-primary"></i>
                <h1>BillScanner <span>2026</span></h1>
            </div>
            <div class="status-indicators">
                <div id="sync-status" class="status-pill offline">
                    <i data-lucide="wifi-off"></i>
                    <span>Sin conexión</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Summary Card -->
            <section class="summary-card">
                <div class="summary-info">
                    <p class="summary-label">Total Mes</p>
                    <h2 id="total-amount">Q0.00</h2>
                </div>
                <div class="summary-actions">
                    <button id="export-btn" class="btn-icon">
                        <i data-lucide="download"></i>
                    </button>
                </div>
            </section>

            <!-- Actions -->
            <section class="quick-actions">
                <button id="camera-btn" class="btn-primary main-action">
                    <i data-lucide="camera"></i>
                    Escanear Factura
                </button>
            </section>

            <!-- List of Invoices -->
            <section class="invoice-list-section">
                <div class="section-header">
                    <h3>Recientes</h3>
                    <span id="invoice-count" class="badge">0</span>
                </div>
                <div id="invoice-list" class="invoice-list grid">
                    <!-- Placeholder/Empty State -->
                    <div class="empty-state">
                        <i data-lucide="file-text"></i>
                        <p>No hay facturas registradas</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Dynamic Modals / Overlays -->
        <div id="camera-overlay" class="overlay hidden">
            <div class="camera-ui">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <div class="camera-controls">
                    <button id="close-camera" class="btn-round secondary"><i data-lucide="x"></i></button>
                    <button id="take-photo" class="btn-round primary large"><i data-lucide="aperture"></i></button>
                    <button id="switch-camera" class="btn-round secondary"><i data-lucide="rotate-ccw"></i></button>
                </div>
            </div>
        </div>

        <div id="processing-overlay" class="overlay hidden glass">
            <div class="loader-content">
                <div class="spinner"></div>
                <h3>Procesando Factura</h3>
                <p id="processing-status">Leyendo datos con OCR...</p>
            </div>
        </div>

        <div id="edit-modal" class="overlay hidden">
            <div class="modal-card slider-up">
                <div class="modal-header">
                    <h3>Confirmar Datos</h3>
                    <button id="close-modal" class="btn-icon"><i data-lucide="x"></i></button>
                </div>
                <form id="invoice-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Establecimiento</label>
                            <input type="text" id="form-vendor" placeholder="Nombre del comercio" required>
                        </div>
                        <div class="form-group">
                            <label>No. Factura</label>
                            <input type="text" id="form-number" placeholder="0001-ABC" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="form-date" required>
                        </div>
                        <div class="form-group">
                            <label>Total (Q)</label>
                            <input type="number" step="0.01" id="form-total" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="form-category">
                            <option value="alimentacion">Alimentación</option>
                            <option value="transporte">Transporte</option>
                            <option value="tecnologia">Tecnología</option>
                            <option value="hogar">Hogar</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary full-width">Guardar Factura</button>
                </form>
            </div>
        </div>

        <!-- Navigation Bar (Mobile First) -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i data-lucide="home"></i>
                <span>Inicio</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="bar-chart-3"></i>
                <span>Listado</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="settings"></i>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
